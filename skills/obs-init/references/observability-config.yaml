version: "1.0"
service: "unnamed-service"
telemetry_standard: "opentelemetry"
maturity_level: "baseline" # baseline | intermediate | advanced

# Optional SLO example (list of event-based SLOs; see obs-sli; targets are owned by the service team):
# slo:
#   - name: checkout-availability
#     description: "A buyer completes checkout without a server error."
#     sli_type: availability          # availability | latency | correctness
#     event: "POST /checkout"
#     success_predicate: "http.status_code < 500"
#     target: 0.995                   # fraction of good events; replace with the agreed target
#     window_days: 30
# Optional critical route templates can be listed as:
# critical_routes:
#   - "GET /orders/{order_id}"
# sampling_ratio: 1.0 suits development; lower it for high-traffic production.

guardrails:
  forbidden_metric_labels:
    - "user_id"
    - "email"
    - "account_id"
    - "order_id"
    - "transaction_id"
    - "session_id"
    - "request_id"
    - "ip_address"
  fail_silent: true
  async_export: true
  event_driven_propagation: true

pillars:
  traces:
    required_in_scopes: true
    sampling_ratio: 1.0
    propagation: "w3c"
    mandatory_attributes:
      - "app.environment"
  metrics:
    framework_defaults: true
    custom_metrics_limit_per_scope: 2
    required_types:
      - "counter"
      - "histogram"
  logs:
    structured: true
    inject_trace_id: true
    min_level: "info"
